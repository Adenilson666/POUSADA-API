openapi: 3.0.3
info:
  title: Pousada API - Admin
  version: 1.0.0
  description: Documentação das rotas administrativas. Requer JWT (Bearer) e role ADMIN.

servers:
  - url: http://localhost:3002
    description: Local

tags:
  - name: Admin - Users
  - name: Admin - Rooms
  - name: Admin - Reservations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      example:
        message: Acesso negado.

    UserListItem:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: João }
        email: { type: string, example: joao@email.com }
        role: { type: string, example: USER }

    Room:
      type: object
      properties:
        id: { type: integer, example: 1 }
        number: { type: string, example: "001" }
        type:
          type: string
          enum: [single, double, suite]
          example: suite
        price_per_night:
          type: string
          example: "1500.00"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          example: "2026-02-19T00:00:00.000Z"
        updated_at:
          type: string
          example: "2026-02-19T00:00:00.000Z"

    CreateRoomRequest:
      type: object
      required: [number, type, price_per_night]
      properties:
        number: { type: string, example: "010" }
        type:
          type: string
          enum: [single, double, suite]
          example: single
        price_per_night:
          type: number
          example: 150
        is_active:
          type: boolean
          example: true

    UpdateRoomRequest:
      type: object
      properties:
        number: { type: string, example: "011" }
        type:
          type: string
          enum: [single, double, suite]
          example: double
        price_per_night:
          type: number
          example: 280
        is_active:
          type: boolean
          example: true

    ReservationWithUserAndRoom:
      type: object
      properties:
        id: { type: integer, example: 1 }
        user_id: { type: integer, example: 3 }
        room_id: { type: integer, example: 1 }
        check_in: { type: string, example: "2026-03-10" }
        check_out: { type: string, example: "2026-03-15" }
        status: { type: string, example: pending }
        user:
          type: object
          properties:
            id: { type: integer, example: 3 }
            name: { type: string, example: João }
            email: { type: string, example: joao@email.com }
            role: { type: string, example: USER }
        room:
          type: object
          properties:
            id: { type: integer, example: 1 }
            number: { type: string, example: "001" }
            type: { type: string, example: suite }
            price_per_night: { type: string, example: "1500.00" }
            is_active: { type: boolean, example: true }

paths:
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: Listar usuários (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserListItem" }
        "401":
          description: Token inválido ou ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Acesso negado (não admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/rooms:
    get:
      tags: [Admin - Rooms]
      summary: Listar todos os quartos (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista completa de quartos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }

    post:
      tags: [Admin - Rooms]
      summary: Criar quarto (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "201":
          description: Quarto criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400":
          description: Validação falhou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Número de quarto duplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/rooms/{id}:
    patch:
      tags: [Admin - Rooms]
      summary: Atualizar quarto (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoomRequest" }
      responses:
        "200":
          description: Quarto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400":
          description: Validação falhou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [Admin - Rooms]
      summary: Desativar quarto (soft delete) (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: Quarto desativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Quarto desativado com sucesso. }
                  room: { $ref: "#/components/schemas/Room" }
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/reservations:
    get:
      tags: [Admin - Reservations]
      summary: Listar todas as reservas (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de reservas (com user e room)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReservationWithUserAndRoom" }

  /admin/reservations/{id}:
    patch:
      tags: [Admin - Reservations]
      summary: Cancelar reserva (admin)
      description: Rota administrativa que cancela uma reserva pelo ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: Reserva cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Reserva cancelada com sucesso. }
                  reservation: { $ref: "#/components/schemas/ReservationWithUserAndRoom" }
        "400":
          description: Validação falhou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
