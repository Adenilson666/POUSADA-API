openapi: 3.0.3
info:
  title: Pousada API - Admin
  version: 1.0.0
  description: |
    Documentação das rotas administrativas. Requer JWT (Bearer) e role ADMIN.

    ## 🔐 Como usar o token (JWT)
    1) Faça login em **POST /login** (com usuário ADMIN)
    2) Copie o campo **token**
    3) No Swagger, clique em **Authorize** e cole:
       **Bearer SEU_TOKEN_AQUI**
    4) Ou no Insomnia/Postman use o header:
       **Authorization: Bearer SEU_TOKEN_AQUI**

servers:
  - url: http://localhost:3002
    description: Local

tags:
  - name: Admin - Users
  - name: Admin - Rooms
  - name: Admin - Reservations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use o token JWT no formato:
        **Authorization: Bearer <token>**

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    UserListItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }

    Room:
      type: object
      properties:
        id: { type: integer }
        number: { type: string }
        type:
          type: string
          enum: [single, double, suite]
        price_per_night:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    CreateRoomRequest:
      type: object
      required: [number, type, price_per_night]
      properties:
        number: { type: string }
        type:
          type: string
          enum: [single, double, suite]
        price_per_night:
          type: number
        is_active:
          type: boolean

    UpdateRoomRequest:
      type: object
      properties:
        number: { type: string }
        type:
          type: string
          enum: [single, double, suite]
        price_per_night:
          type: number
        is_active:
          type: boolean

    ReservationWithUserAndRoom:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        room_id: { type: integer }
        check_in: { type: string }
        check_out: { type: string }
        status: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            role: { type: string }
        room:
          type: object
          properties:
            id: { type: integer }
            number: { type: string }
            type: { type: string }
            price_per_night: { type: string }
            is_active: { type: boolean }

paths:
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: Listar usuários (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserListItem" }
              examples:
                usuarios:
                  summary: Exemplo de lista
                  value:
                    - id: 1
                      name: "Admin"
                      email: "admin@pousada.com"
                      role: "ADMIN"
                    - id: 3
                      name: "João"
                      email: "joao@email.com"
                      role: "USER"
        "401":
          description: Token inválido ou ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sem_token:
                  value:
                    message: "Token não fornecido."
        "403":
          description: Acesso negado (não admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nao_admin:
                  value:
                    message: "Acesso negado. Permissão de administrador necessária."

  /admin/rooms:
    get:
      tags: [Admin - Rooms]
      summary: Listar todos os quartos (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista completa de quartos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }
              examples:
                lista:
                  value:
                    - id: 1
                      number: "001"
                      type: "suite"
                      price_per_night: "1500.00"
                      is_active: true
                      created_at: "2026-02-19T00:00:00.000Z"
                      updated_at: "2026-02-19T00:00:00.000Z"
                    - id: 2
                      number: "002"
                      type: "single"
                      price_per_night: "150.00"
                      is_active: false
                      created_at: "2026-02-19T00:00:00.000Z"
                      updated_at: "2026-02-19T00:00:00.000Z"

    post:
      tags: [Admin - Rooms]
      summary: Criar quarto (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
            examples:
              criar_quarto:
                summary: Exemplo de criação
                value:
                  number: "008"
                  type: "double"
                  price_per_night: 320
                  is_active: true
      responses:
        "201":
          description: Quarto criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
              examples:
                sucesso:
                  value:
                    id: 8
                    number: "008"
                    type: "double"
                    price_per_night: "320.00"
                    is_active: true
                    created_at: "2026-02-19T00:00:00.000Z"
                    updated_at: "2026-02-19T00:00:00.000Z"
        "400":
          description: Validação falhou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                tipo_invalido:
                  value:
                    message: "type inválido. Use: 'single', 'double' ou 'suite'."
        "409":
          description: Número de quarto duplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                duplicado:
                  value:
                    message: "Número de quarto já cadastrado."

  /admin/rooms/{id}:
    patch:
      tags: [Admin - Rooms]
      summary: Atualizar quarto (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoomRequest" }
            examples:
              atualizar_preco:
                summary: Atualizar preço
                value:
                  price_per_night: 180
              desativar:
                summary: Desativar (via update)
                value:
                  is_active: false
      responses:
        "200":
          description: Quarto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nao_encontrado:
                  value:
                    message: "Quarto não encontrado."

    delete:
      tags: [Admin - Rooms]
      summary: Desativar quarto (soft delete) (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: Quarto desativado
          content:
            application/json:
              examples:
                sucesso:
                  value:
                    message: "Quarto desativado com sucesso."

  /admin/reservations:
    get:
      tags: [Admin - Reservations]
      summary: Listar todas as reservas (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de reservas (com user e room)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReservationWithUserAndRoom" }
              examples:
                lista_reservas:
                  value:
                    - id: 1
                      user_id: 3
                      room_id: 1
                      check_in: "2026-03-10"
                      check_out: "2026-03-15"
                      status: "pending"
                      user:
                        id: 3
                        name: "João"
                        email: "joao@email.com"
                        role: "USER"
                      room:
                        id: 1
                        number: "001"
                        type: "suite"
                        price_per_night: "1500.00"
                        is_active: true

  /admin/reservations/{id}:
    patch:
      tags: [Admin - Reservations]
      summary: Cancelar reserva (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: Reserva cancelada
          content:
            application/json:
              examples:
                sucesso:
                  value:
                    message: "Reserva cancelada com sucesso."
                    reservation:
                      id: 1
                      status: "cancelled"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nao_encontrada:
                  value:
                    message: "Reserva não encontrada."
